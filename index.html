<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        html, body {
            height: 100%;
            overflow: hidden; /* Prevent pull-to-refresh on mobile */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-full w-full flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-md"></div>

    <!-- Main App Container -->
    <div id="app" class="flex-1 w-full h-full max-w-3xl mx-auto bg-white shadow-xl flex flex-col relative overflow-hidden sm:border-x border-gray-200">
        <!-- Loading Screen -->
        <div id="loading-view" class="absolute inset-0 bg-white flex flex-col items-center justify-center z-40">
            <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin mb-4"></i>
            <p class="text-gray-500 font-medium">Connecting...</p>
        </div>

        <!-- Auth View -->
        <div id="auth-view" class="absolute inset-0 bg-white flex flex-col items-center justify-center z-30 hidden p-6 text-center">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="message-circle" class="w-10 h-10 text-blue-600"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2">Welcome to Chat</h1>
            <p class="text-gray-500 mb-10 max-w-sm">Sign in to start texting your friends in real-time rooms.</p>
            
            <button id="btn-google-signin" class="flex items-center justify-center gap-3 w-full max-w-sm bg-white border border-gray-300 text-gray-700 font-medium py-3 px-4 rounded-xl shadow-sm hover:bg-gray-50 transition-colors mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <button id="btn-guest-signin" class="text-sm text-gray-500 hover:text-gray-800 transition-colors">
                Continue as Guest
            </button>
        </div>

        <!-- Room Selection View -->
        <div id="room-view" class="absolute inset-0 bg-gray-50 flex flex-col items-center justify-center z-20 hidden p-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-sm text-center">
                <div class="flex justify-center mb-4">
                    <img id="user-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full border-2 border-white shadow-md">
                </div>
                <h2 class="text-xl font-bold mb-1">Hi, <span id="user-display-name">User</span>!</h2>
                <p class="text-gray-500 text-sm mb-6">Enter a room code to chat with friends.</p>
                
                <form id="room-form" class="flex flex-col gap-3">
                    <input type="text" id="room-input" placeholder="e.g. secret-club" required pattern="[A-Za-z0-9-]+" title="Only letters, numbers, and dashes allowed"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center font-medium">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-colors flex justify-center items-center gap-2">
                        <i data-lucide="log-in" class="w-5 h-5"></i>
                        Join Room
                    </button>
                </form>
                
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <button id="btn-sign-out" class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors">
                        Sign Out
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="absolute inset-0 bg-gray-50 flex flex-col z-10 hidden">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button id="btn-leave-room" class="p-2 -ml-2 text-gray-500 hover:text-gray-800 rounded-full hover:bg-gray-100 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 class="font-bold text-gray-800 leading-tight flex items-center gap-2">
                            <i data-lucide="hash" class="w-4 h-4 text-gray-400"></i>
                            <span id="current-room-name">room-name</span>
                        </h2>
                        <p class="text-xs text-green-500 font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 block"></span> Live
                        </p>
                    </div>
                </div>
                <button id="btn-share-room" class="p-2 text-gray-500 hover:text-blue-600 rounded-full hover:bg-blue-50 transition-colors" title="Copy Room Code">
                    <i data-lucide="share" class="w-5 h-5"></i>
                </button>
            </header>

            <!-- Messages Area -->
            <main id="messages-container" class="flex-1 overflow-y-auto chat-scroll p-4 flex flex-col gap-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                <!-- Messages will be injected here -->
            </main>

            <!-- Input Area -->
            <footer class="bg-white border-t border-gray-200 p-3 sm:p-4 shrink-0">
                <form id="chat-form" class="flex items-end gap-2 max-w-3xl mx-auto">
                    <div class="flex-1 bg-gray-100 rounded-2xl overflow-hidden flex items-end px-3 py-1 border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all">
                        <textarea id="message-input" rows="1" placeholder="Message..." class="w-full bg-transparent border-none focus:ring-0 resize-none py-2 max-h-32 text-gray-800 placeholder-gray-500" style="min-height: 40px;"></textarea>
                    </div>
                    <button type="submit" id="btn-send" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed shrink-0 flex items-center justify-center h-[46px] w-[46px]">
                        <i data-lucide="send" class="w-5 h-5 ml-1"></i>
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        // --- 1. FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 2. INITIALIZATION ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-chat-app';
        const googleProvider = new GoogleAuthProvider();

        // Initialize Lucide Icons
        lucide.createIcons();

        // --- 3. STATE ---
        let currentUser = null;
        let currentRoom = null;
        let unsubscribeChat = null;
        let messages = [];

        // --- 4. DOM ELEMENTS ---
        const views = {
            loading: document.getElementById('loading-view'),
            auth: document.getElementById('auth-view'),
            room: document.getElementById('room-view'),
            chat: document.getElementById('chat-view')
        };
        
        // Auth UI
        const btnGoogleSignin = document.getElementById('btn-google-signin');
        const btnGuestSignin = document.getElementById('btn-guest-signin');
        const btnSignOut = document.getElementById('btn-sign-out');
        
        // Room UI
        const roomForm = document.getElementById('room-form');
        const roomInput = document.getElementById('room-input');
        const userDisplayName = document.getElementById('user-display-name');
        const userAvatar = document.getElementById('user-avatar');
        
        // Chat UI
        const currentRoomName = document.getElementById('current-room-name');
        const btnLeaveRoom = document.getElementById('btn-leave-room');
        const btnShareRoom = document.getElementById('btn-share-room');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const btnSend = document.getElementById('btn-send');
        const toastContainer = document.getElementById('toast-container');

        // --- 5. UTILITIES ---
        const showView = (viewName) => {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
        };

        const showToast = (message, type = 'error') => {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium fade-in flex justify-between items-center`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="ml-4 opacity-75 hover:opacity-100">&times;</button>
            `;
            toast.querySelector('button').onclick = () => toast.remove();
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.replace('fade-in', 'opacity-0');
                    toast.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        };

        const generateAvatar = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;

        const autoResizeTextarea = () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = (messageInput.scrollHeight < 120 ? messageInput.scrollHeight : 120) + 'px';
        };

        const formatTime = (timestamp) => {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        // --- 6. AUTHENTICATION (RULE 3 compliance) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                showToast("Connection setup failed. Please try refreshing.", "error");
            }
        };

        // Start initialization immediately
        initAuth();

        // Listen for auth state changes
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // If the user just signed in anonymously but hasn't fully logged in with Google,
                // we might want to still show the Auth view or let them proceed as Guest.
                // We'll track if they have a real provider (Google) or just anonymous.
                const isAnonymous = user.isAnonymous;
                
                // Set UI data
                userDisplayName.textContent = user.displayName || (isAnonymous ? 'Guest' : 'User');
                userAvatar.src = user.photoURL || generateAvatar(user.uid);

                if (isAnonymous && !sessionStorage.getItem('guest_mode_agreed')) {
                    // Show auth screen to encourage Google Sign In
                    showView('auth');
                } else {
                    // Ready to choose a room
                    if (currentRoom) {
                        showView('chat');
                    } else {
                        showView('room');
                    }
                }
            } else {
                showView('auth');
            }
        });

        // Google Sign In handler
        btnGoogleSignin.addEventListener('click', async () => {
            try {
                // Using popup for Google sign in
                await signInWithPopup(auth, googleProvider);
                sessionStorage.removeItem('guest_mode_agreed');
                showToast("Signed in with Google!", "success");
            } catch (error) {
                if (error.code === 'auth/popup-closed-by-user') {
                    // Ignored
                } else {
                    showToast("Google Sign-In failed. Please try Guest mode.", "error");
                    console.error(error);
                }
            }
        });

        // Guest Sign In handler
        btnGuestSignin.addEventListener('click', () => {
            sessionStorage.setItem('guest_mode_agreed', 'true');
            showView('room');
        });

        // Sign Out handler
        btnSignOut.addEventListener('click', async () => {
            try {
                sessionStorage.removeItem('guest_mode_agreed');
                if (currentRoom) leaveRoom();
                await signOut(auth);
                // The auth state listener will handle showing the auth view
                // Re-init canvas auth so the underlying connection isn't broken for next login attempt
                initAuth(); 
            } catch (error) {
                showToast("Error signing out.", "error");
            }
        });


        // --- 7. ROOM LOGIC ---
        roomForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const roomCode = roomInput.value.trim().toLowerCase();
            if (roomCode) {
                joinRoom(roomCode);
            }
        });

        const joinRoom = (roomId) => {
            currentRoom = roomId;
            currentRoomName.textContent = roomId;
            showView('chat');
            messagesContainer.innerHTML = ''; // Clear previous messages
            
            // Clean up previous listener
            if (unsubscribeChat) unsubscribeChat();

            // RULE 1: Correct path structure
            // RULE 2: No complex queries (no orderBy). Fetch simple collection, sort in JS.
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', `room_${roomId}`);

            unsubscribeChat = onSnapshot(messagesRef, (snapshot) => {
                if (!currentUser) return; // Guard
                
                messages = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Sort messages by createdAt in memory (RULE 2 compliance)
                messages.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                
                renderMessages();
            }, (error) => {
                showToast("Error loading messages.", "error");
                console.error(error);
            });
        };

        const leaveRoom = () => {
            if (unsubscribeChat) {
                unsubscribeChat();
                unsubscribeChat = null;
            }
            currentRoom = null;
            messages = [];
            showView('room');
            roomInput.value = '';
        };

        btnLeaveRoom.addEventListener('click', leaveRoom);
        
        btnShareRoom.addEventListener('click', () => {
            if (currentRoom) {
                try {
                    // Attempt clipboard copy
                    const dummy = document.createElement('textarea');
                    dummy.value = `Join my chat room: ${currentRoom}`;
                    document.body.appendChild(dummy);
                    dummy.select();
                    document.execCommand('copy');
                    document.body.removeChild(dummy);
                    showToast("Room code copied!", "success");
                } catch(e) {
                    showToast(`Room code: ${currentRoom}`, "success");
                }
            }
        });


        // --- 8. CHAT RENDERING ---
        const renderMessages = () => {
            const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 100;
            
            messagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-gray-400 opacity-70">
                        <i data-lucide="message-square-dashed" class="w-12 h-12 mb-3"></i>
                        <p>No messages yet. Say hi!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let lastUid = null;

            messages.forEach(msg => {
                const isMe = msg.uid === currentUser.uid;
                const showHeader = msg.uid !== lastUid || isMe === false; // Always show sender name if not me and different from last
                
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'} mb-1 fade-in`;
                
                const innerHtml = `
                    <div class="flex max-w-[85%] ${isMe ? 'flex-row-reverse' : 'flex-row'} items-end gap-2">
                        ${!isMe && showHeader ? `<img src="${msg.photoURL || generateAvatar(msg.uid)}" alt="${msg.displayName}" class="w-8 h-8 rounded-full mb-1 border border-gray-200 shrink-0">` : `<div class="w-8 shrink-0 ${isMe ? 'hidden' : 'block'}"></div>`}
                        
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            ${!isMe && showHeader ? `<span class="text-[11px] text-gray-500 mb-1 ml-1">${msg.displayName}</span>` : ''}
                            
                            <div class="relative group px-4 py-2.5 rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-sm shadow-sm'} break-words whitespace-pre-wrap text-[15px] leading-relaxed">
                                ${msg.text}
                                <span class="text-[10px] ${isMe ? 'text-blue-200' : 'text-gray-400'} float-right ml-3 mt-2">${formatTime(msg.createdAt)}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                msgWrapper.innerHTML = innerHtml;
                messagesContainer.appendChild(msgWrapper);
                lastUid = msg.uid;
            });

            if (isAtBottom) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        };


        // --- 9. SENDING MESSAGES ---
        messageInput.addEventListener('input', autoResizeTextarea);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            
            if (!text || !currentUser || !currentRoom) return;

            // Reset input UI immediately for responsiveness
            messageInput.value = '';
            autoResizeTextarea();
            messageInput.focus();

            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', `room_${currentRoom}`);
            
            try {
                await addDoc(messagesRef, {
                    text: text,
                    uid: currentUser.uid,
                    displayName: currentUser.displayName || 'Guest',
                    photoURL: currentUser.photoURL || generateAvatar(currentUser.uid),
                    createdAt: Date.now() // Simple timestamp for JS sorting
                });
                
                // Force scroll to bottom on our own send
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 100);

            } catch (error) {
                showToast("Failed to send message.", "error");
                console.error("Error writing document: ", error);
            }
        });

    </script>
</body>
</html>
